<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c0b30" />
    <title>Giant at Large</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="flash"></div>
      <div id="rampfx" aria-hidden="true"></div>

      <div id="debug" hidden></div>

      <!-- Phase 0c broadcast HUD (§21): LIVE badge, station bug, chyron. -->
      <div id="hud" aria-live="polite">
        <div id="live"><span class="dot"></span><b>LIVE</b><span id="clock">0:00</span><span id="segno" hidden></span><span id="camtag" aria-hidden="true"></span></div>
        <div id="desk" hidden aria-hidden="true"><div class="set"><i class="a1"></i><i class="a2"></i><div class="counter">WYF <b>6</b> NEWS DESK</div></div><span class="tag">STUDIO</span></div>
        <div id="pip" hidden aria-hidden="true"><span class="tag">VIEWER VIDEO</span></div>
        <div id="ticker" hidden aria-hidden="true"><span></span></div>
        <div id="ratings" aria-label="Score and audience"><b id="score">0</b><span class="lbl">SCORE</span><span class="bar" aria-label="Audience"><i id="ratingsbar"></i></span><span class="aud">AUDIENCE</span></div>
        <div id="chain" aria-live="off"><b class="mult">×1</b><span class="stunt"></span><span class="pts"></span><span class="cnt"></span><span class="clock"><i></i></span></div>
        <div id="bug" aria-hidden="true"><span class="ch">6</span><span class="call">WYF<i>NEWS</i><span id="heat"><em>★</em><em>★</em><em>★</em><em>★</em><em>★</em></span></span></div>
        <div id="boxed" hidden><b>BOXED IN</b><i><u></u></i><span class="how"></span></div>
        <div id="signoff" hidden><b>SIGN-OFF</b><span id="exitdist">200m</span><span class="arrow">➜</span></div>
        <div id="asks" aria-label="Producer's asks"><div class="hd">PRODUCER</div><ol></ol></div>
        <div id="gears" aria-label="Rampage meter"><span class="lbl">RAMPAGE</span><i class="meter"></i><b class="nm">STRIDE</b><b class="x">×1</b></div>
        <div id="chyron"><div class="kicker">SPOTTED</div><div class="place" aria-hidden="true"></div><div class="text"><span>&nbsp;</span></div></div>
      </div>
      <div id="cover" hidden aria-hidden="true"><img alt="" /></div>
      <div id="titlebug" hidden aria-hidden="true"><b><i></i>LIVE</b><span>Traffic report</span><span id="titleroad"></span></div>
      <div id="controls" hidden aria-hidden="true"></div>
      <div id="replay" hidden aria-live="polite"><b>REPLAY</b><span>Tonight's top moment</span><small>Press to skip</small></div>
      <div id="abilpop" aria-live="polite"></div>
      <div id="prompt" hidden aria-live="polite"></div>
      <div id="abil" hidden aria-hidden="true"><img class="ic" alt="" /><b class="nm"></b><span class="key"></span><span class="cd"><i></i></span></div>
      <div id="tierbar" aria-hidden="true"><span class="name">JOG</span><span class="meter"><i></i></span></div>

      <div id="touch-ui" hidden>
        <button id="btn-ability" disabled aria-label="Ability (none equipped)">ABL</button>
        <button id="btn-shoulder" aria-label="Rampage">RAMP</button>
      </div>
      <button id="btn-pause" aria-label="Pause">II</button>


      <div id="fatal" class="overlay" hidden role="alert">
        <div class="card">
          <div class="kicker">TECHNICAL DIFFICULTIES</div>
          <h2></h2>
          <p class="body"></p>
          <p class="detail"></p>
          <button class="go" onclick="location.reload()">Reload</button>
        </div>
      </div>

      <div id="coldopen" hidden aria-hidden="true"><span class="cam">WYF TRAFFIC CAM 14</span><span class="ts" id="coldts"></span></div>
      <!-- SLU Web Shell screens (title, menus, pause, settings) mount here. -->
      <div id="ui"></div>
      <div id="recap" class="overlay" hidden role="dialog" aria-label="The 11 O'Clock Recap"></div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
